services:
    desk:
        image: ghcr.io/xycertbsi/alpine_desk:main
        container_name: alpine_desk

        environment:
            - XRDP_USER=groot
            - XRDP_PASSWORD=1234
            - XRDP_SESSION=icewm-session

            - PLUS_PACKAGES=xterm icewm
            - XRDP_USER_GROUPS=bin daemon sys adm disk wheel floppy dialout tape video

        ports:
            - 8000:2000
